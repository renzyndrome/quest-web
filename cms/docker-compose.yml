# Quest Laguna content CMS — Payload 3 + its own Postgres.
# Deploy as a Docker Compose service in Dokploy; set env vars in the
# Dokploy environment tab (see cms/.env.example).
#
# This database holds MARKETING CONTENT ONLY. Member and finance data live in
# the membership app's own database — never connect Payload to it.
#
# Dokploy setup:
#   1. Create service → Compose, point at this repo, compose path: cms/docker-compose.yml
#   2. Set the env vars from cms/.env.example
#   3. Add a domain (e.g. cms.questlaguna.org) → service "payload", port 3000, HTTPS on
#   4. First boot: open /admin and create the first admin user

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-payload}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in the environment}
      POSTGRES_DB: ${DB_DATABASE:-quest_content}
    volumes:
      - payload_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-payload} -d ${DB_DATABASE:-quest_content}']
      interval: 10s
      timeout: 5s
      retries: 5

  payload:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in the environment}
      DATABASE_URI: postgres://${DB_USER:-payload}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE:-quest_content}
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:-http://localhost:3000}
      SITE_ORIGIN: ${SITE_ORIGIN:-https://questlaguna.org}
      SITE_URL: ${SITE_URL:-https://questlaguna.org}
      # Publish → rebuild the site. Unset = hook no-ops.
      DOKPLOY_DEPLOY_URL: ${DOKPLOY_DEPLOY_URL:-}
      # Submit → email the approver. Unset = hook no-ops.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      APPROVER_EMAIL: ${APPROVER_EMAIL:-}
      APPROVER_FROM_EMAIL: ${APPROVER_FROM_EMAIL:-}
      # Builds the "Preview" button and the preview link in the approval email.
      # Must be the SAME value as PREVIEW_SECRET on the site service, or the
      # link 404s. Unset = no preview button (the site route is off too).
      PREVIEW_SECRET: ${PREVIEW_SECRET:-}
      MEDIA_DIR: /app/media
      # Uploads → Cloudflare R2. Set R2_BUCKET to switch storage over; leave
      # every R2_* var unset and files stay on the payload_media volume below.
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      # Public base URL files are served from — the R2 custom domain, e.g.
      # https://media.questlaguna.org. This is what gets baked into the site's
      # <img src>, so it must be publicly reachable. No trailing slash.
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      # Migrations always run on boot. Set this to "true" to also seed the
      # church's starting content (photo library, announcements, events,
      # slides) on first boot. It is additive and never overwrites an existing
      # item, so it is safe to leave on — but "false" after the first deploy
      # keeps restarts fast.
      SEED_ON_BOOT: ${SEED_ON_BOOT:-false}
      # LOCAL DEVELOPMENT ONLY. When both are set the seed creates an admin
      # with these credentials. Leave them UNSET in production so Payload
      # shows its onboarding screen and the first admin picks their own
      # password — there is deliberately no default account.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    networks:
      # dokploy-network is how Dokploy's Traefik reaches this container. A
      # Compose service must join it explicitly — unlike an Application
      # service, which Dokploy attaches automatically. Without it the domain
      # resolves but every request 502s, because the proxy has a route and no
      # reachable backend.
      #
      # `default` is listed too: naming any network opts out of the implicit
      # one, and postgres lives on default.
      - dokploy-network
      - default
    volumes:
      # Only used while R2_BUCKET is unset. Keep it mounted after switching to
      # R2 — it is the copy of everything uploaded before the cutover.
      - payload_media:/app/media
    # Local development only — in Dokploy, attach a domain instead:
    # ports:
    #   - '3000:3000'

networks:
  # Created by Dokploy on the server. Locally, `make cms` creates it first —
  # or run `docker network create dokploy-network` once by hand.
  dokploy-network:
    external: true

volumes:
  payload_db:
  payload_media:
