# Quest Laguna content CMS — Payload 3 + its own Postgres.
# Deploy as a Docker Compose service in Dokploy; set env vars in the
# Dokploy environment tab (see cms/.env.example).
#
# This database holds MARKETING CONTENT ONLY. Member and finance data live in
# the membership app's own database — never connect Payload to it.
#
# Dokploy setup:
#   1. Create service → Compose, point at this repo, compose path: cms/docker-compose.yml
#   2. Set the env vars from cms/.env.example
#   3. Add a domain (e.g. cms.questlaguna.org) → service "payload", port 3000, HTTPS on
#   4. First boot: open /admin and create the first admin user

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-payload}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in the environment}
      POSTGRES_DB: ${DB_DATABASE:-quest_content}
    volumes:
      - payload_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-payload} -d ${DB_DATABASE:-quest_content}']
      interval: 10s
      timeout: 5s
      retries: 5

  payload:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in the environment}
      DATABASE_URI: postgres://${DB_USER:-payload}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE:-quest_content}
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:-http://localhost:3000}
      SITE_ORIGIN: ${SITE_ORIGIN:-https://questlaguna.org}
      SITE_URL: ${SITE_URL:-https://questlaguna.org}
      # Publish → rebuild the site. Unset = hook no-ops.
      DOKPLOY_DEPLOY_URL: ${DOKPLOY_DEPLOY_URL:-}
      # Submit → email the approver. Unset = hook no-ops.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      APPROVER_EMAIL: ${APPROVER_EMAIL:-}
      APPROVER_FROM_EMAIL: ${APPROVER_FROM_EMAIL:-}
      MEDIA_DIR: /app/media
    volumes:
      # Local uploads volume for now; switch to Cloudflare R2 via the S3
      # storage adapter when media volume grows.
      - payload_media:/app/media
    # Local development only — in Dokploy, attach a domain instead:
    # ports:
    #   - '3000:3000'

volumes:
  payload_db:
  payload_media:
